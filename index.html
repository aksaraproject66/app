<style>
:root{
  /* palet diambil dari logo AHE AKSARA */
  --pri:#016EC0; --pri-d:#01548F; --pri-50:#E4F0FA; --pri-100:#C6E0F5;
  --red:#D60A0B; --red-d:#A30808; --red-50:#FDE9E8;
  --coral:#E46850; --coral-50:#FCEDE9;
  --green:#7FA33A; --green-d:#5E7B25; --green-50:#EEF5DF; --ok:#2E8B4E; --ok-50:#E2F4E8;
  --orange:#FE9249; --orange-d:#C9651F; --orange-50:#FFF0E5;
  --teal:#0197B2; --teal-50:#DFF3F7;
  --periw:#5470FF; --periw-50:#E9EDFF;
  --yellow:#F5B82E; --yellow-50:#FFF6DC;
  --ink:#2B3036; --ink-2:#565D66; --muted:#8A929C; --line:#E3EAF2;
  --bg:#F4F8FC; --card:#FFFFFF;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 0 rgba(43,48,54,.04), 0 8px 24px -14px rgba(1,110,192,.28);
  --font-h:'Fredoka','Nunito',system-ui,sans-serif;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:600;line-height:1.2;letter-spacing:.1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--pri);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}.g2:not(.keep){grid-template-columns:1fr}.g4.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* pita warna khas logo */
.stripe{display:flex;height:6px;border-radius:6px;overflow:hidden}
.stripe i{flex:1}
.stripe i:nth-child(1){background:#D60A0B}.stripe i:nth-child(2){background:#A3C04A}.stripe i:nth-child(3){background:#016EC0}.stripe i:nth-child(4){background:#FE9249}.stripe i:nth-child(5){background:#0197B2}.stripe i:nth-child(6){background:#5470FF}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;background:var(--pri);color:#fff;box-shadow:0 3px 0 var(--pri-d);transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pri-d)}
.btn svg{width:17px;height:17px}
.btn.sm{padding:6px 12px;font-size:13px;box-shadow:0 2px 0 var(--pri-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line)}
.btn.orange{background:var(--orange);box-shadow:0 3px 0 var(--orange-d)}
.btn.green{background:var(--ok);box-shadow:0 3px 0 #1E6638}
.btn.wa{background:#25D366;box-shadow:0 3px 0 #179C4A}
.btn.red{background:var(--red);box-shadow:0 3px 0 var(--red-d)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.icon-btn:hover{background:var(--pri-50);color:var(--pri)}
.icon-btn svg{width:20px;height:20px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:800;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-50)}
.input.sm{padding:6px 10px;width:auto}
textarea.input{min-height:84px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid h4{grid-column:1/-1;font-size:15px;color:var(--pri);margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--pri)}
.box{border:1.5px solid var(--line);border-radius:14px;padding:12px}
.picklist{max-height:240px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #E8EEF5;padding:18px;min-width:0}
.card h3{font-size:18px;margin-bottom:10px}
.card-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.stat{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.stat .val{font-family:var(--font-h);font-size:26px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.stat .sub{font-size:12px;color:var(--ink-2)}
.stat.click{cursor:pointer;transition:transform .12s}.stat.click:hover{transform:translateY(-2px)}
.bg-pri{background:var(--pri-50)} .bg-red{background:var(--red-50)} .bg-green{background:var(--green-50)} .bg-ok{background:var(--ok-50)} .bg-orange{background:var(--orange-50)} .bg-teal{background:var(--teal-50)} .bg-periw{background:var(--periw-50)} .bg-coral{background:var(--coral-50)} .bg-yellow{background:var(--yellow-50)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-green{background:var(--ok-50);color:#1E6638}
.b-red{background:var(--red-50);color:var(--red-d)}
.b-yellow{background:var(--yellow-50);color:#8A6200}
.b-orange{background:var(--orange-50);color:var(--orange-d)}
.b-blue{background:var(--pri-50);color:var(--pri-d)}
.b-teal{background:var(--teal-50);color:#016F83}
.b-periw{background:var(--periw-50);color:#3149C9}
.b-gray{background:#EEF1F5;color:var(--ink-2)}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.unpaid td{background:#FFF5F4}
.t tr.unpaid td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.t tr.void td{opacity:.5;text-decoration:line-through}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#F7FAFD}
.t tfoot td{font-weight:800;border-top:1.5px solid var(--line)}
.t .c{text-align:center}
.t .r{text-align:right}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:999px;font-weight:800;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(circle at 10% 15%, var(--orange-50) 0 120px, transparent 121px),
  radial-gradient(circle at 90% 85%, var(--pri-50) 0 170px, transparent 171px),
  radial-gradient(circle at 88% 10%, var(--green-50) 0 90px, transparent 91px), var(--bg)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:28px;padding:26px 24px 22px;box-shadow:0 20px 50px -24px rgba(1,110,192,.5);text-align:center;overflow:hidden;position:relative}
.login-card .stripe{position:absolute;left:0;right:0;top:0;border-radius:0}
.login-card .logo{width:230px;max-width:80%;margin:6px auto 6px;display:block}
.login-card h1{font-size:22px}
.login-card .tabs{margin:16px 0 14px;justify-content:center}
.login-card .tabs button{flex:1;padding:8px 10px}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.demo-box{margin-top:14px;background:var(--yellow-50);border-radius:14px;padding:10px 12px;font-size:12.5px;text-align:left;color:#6B5200}
.demo-box b{color:var(--ink)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.brand{padding:2px 6px 10px;text-align:center}
.brand img{width:150px;display:block;margin:0 auto 4px}
.brand span{font-size:12px;color:var(--muted);font-weight:700}
.side .stripe{margin:0 6px 10px;height:4px}
.nav-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 12px 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:14px;font-weight:700;color:var(--ink-2);text-align:left;width:100%}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:var(--pri-50);color:var(--pri)}
.nav-item.on{background:var(--pri);color:#fff}
.nav-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.nav-item.on .cnt{background:#fff;color:var(--red)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 26px;position:sticky;top:0;z-index:20;background:rgba(244,248,252,.92);backdrop-filter:blur(8px);flex-wrap:wrap}
.topbar h2{font-size:22px}
.topbar .menu-btn,.topbar .home-btn,.mobile-only{display:none!important}
.cab-sel{max-width:190px;padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px;background:#fff;border:1.5px solid var(--pri-100);color:var(--pri-d)}
.content{padding:6px 26px 40px;display:flex;flex-direction:column;gap:16px;max-width:1280px;width:100%}
.user-pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.user-pill small{display:block;font-size:11px;color:var(--muted);line-height:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-family:var(--font-h);font-weight:700;color:#fff;font-size:14px;flex-shrink:0}
.mode-flag{position:fixed;bottom:12px;right:12px;pointer-events:none;z-index:80;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;opacity:.9}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:276px;z-index:60;transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(43,48,54,.35);z-index:55}
  .topbar{padding:10px 16px;gap:6px}
  .topbar .menu-btn,.topbar .home-btn{display:inline-grid!important}
  .nav-item.mobile-only{display:flex!important}
  .topbar h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .spacer{display:none}
  .user-pill .nm{display:none}
  .user-pill{padding:3px}
  .cab-sel{order:9;max-width:none;width:100%}

function newId_(name, existing) {
  const sq = SEQ[name];
  if (sq) {
    let max = 0; const re = new RegExp('^' + sq[0] + '(\\d+)$');
    existing.forEach(r => { const m = String(r.id).match(re); if (m && +m[1] > max) max = +m[1]; });
    return sq[0] + String(max + 1).padStart(sq[1], '0');
  }
  return name.slice(0, 2).toUpperCase() + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function createApi(DB) {
  const T = t => DB.read(t);

  const settings = () => Object.assign({}, DEFAULT_SETTINGS, DB.settings());
  const pubSettings = () => { const s = settings(), o = {}; PUBLIC_KEYS.forEach(k => o[k] = s[k]); return o; };
  const list = c => String(c || '').split(',').map(x => x.trim()).filter(Boolean);
  const isOwner = u => u.akses === 'Pemilik';
  const safeUser = u => ({ id: u.id, username: u.username, nama: u.nama, akses: u.akses || 'Admin', cabang: u.cabang || '', keuangan: u.keuangan || 'Ya', status: u.status || 'Aktif' });

    return saved;
  }

  /* ---------- sesi ---------- */
  function login(req) {
    const role = String(req.role || ''), user = String(req.user || '').trim(), pass = String(req.pass || '').trim();
    if (!user || !pass) return fail('Lengkapi data login.');
    if (DB.beforeLogin) DB.beforeLogin();
    let profile = null;
    if (role === 'admin') {
      const u = T('Users').find(r => String(r.username).toLowerCase() === user.toLowerCase());
      if (u && u.status !== 'Nonaktif' && u.passwordHash === DB.hash(pass)) profile = safeUser(u);
    } else if (role === 'guru') {
      const g = T('Guru').find(r => String(r.id).toUpperCase() === user.toUpperCase());
      if (g && String(g.pin) === pass && g.status !== 'Nonaktif') profile = { id: g.id, nama: g.nama };
    } else if (role === 'ortu') {
      const s = T('Siswa').find(r => String(r.id).toUpperCase() === user.toUpperCase());
      if (s && String(s.kodeOrtu) === pass && s.status !== 'Keluar') profile = { id: s.id, nama: s.nama, panggilan: s.panggilan };
    }
    if (!profile) return fail(role === 'admin' ? 'Username atau password salah.' : role === 'guru' ? 'ID guru atau PIN salah.' : 'ID siswa atau kode akses salah.');
    const token = DB.uid() + DB.uid();
    DB.sessPut(token, { role: role, uid: profile.id });
    if (role === 'admin') log(profile.nama, 'Login', 'Users', profile.id, '');
    return ok({ token: token, role: role, profile: profile });
  }

  function route(req) {
    const a = req.action;
    if (a === 'ping') return ok({ time: DB.nowISO() });
    if (a === 'login') return login(req);
    const s = DB.sessGet(req.token);
    if (!s) return fail('SESSION', 'Sesi berakhir, silakan login kembali.');
    if (a === 'logout') { DB.sessDel(req.token); return ok(); }
    if (s.role === 'admin') {
      const u = T('Users').find(r => r.id === s.uid);
      if (!u || u.status === 'Nonaktif') return fail('SESSION', 'Akun tidak aktif.');
      return adminRoute(u, req);
    }
    if (s.role === 'guru') {
      const g = T('Guru').find(r => r.id === s.uid);
      if (!g || g.status === 'Nonaktif') return fail('SESSION', 'Akun guru tidak aktif.');
      return guruRoute(g, req);
    }
    if (s.role === 'ortu') {
      if (a === 'me') return ok({ data: me(s.uid) });
    }
    return fail('Akses ditolak');
  }

  /* ---------- ADMIN ---------- */
  function adminRoute(u, req) {
    const a = req.action, owner = isOwner(u), who = u.nama;
    const checkTable = (t, write) => {
      if (DATA_TABLES.indexOf(t) < 0) throw new Error('Tabel tidak dikenal: ' + t);
      if (write && !owner && OWNER_ONLY_WRITE.indexOf(t) > -1) throw new Error('Hanya pemilik yang dapat mengubah data ' + t + '.');
    };
    const prep = (t, rows) => rows.map(r => {
      const o = clean(t, r);
      if (u.cabang && CAB_TABLES.indexOf(t) > -1) o.cabang = u.cabang;
      if ((t === 'Kas' || t === 'StokMutasi') && !o.id) o.user = who;
      return o;
    });
    switch (a) {
      case 'bootstrap': return ok({ data: bootstrap(u) });
      case 'save': checkTable(req.table, true); return ok({ row: DB.lock(() => writeRows(who, req.table, prep(req.table, [req.row]))[0]) });
      case 'saveMany': checkTable(req.table, true); return ok({ rows: DB.lock(() => writeRows(who, req.table, prep(req.table, req.rows || []))) });
      case 'remove': {
        checkTable(req.table, true);
        if ((owner ? OWNER_REMOVE : ADMIN_REMOVE).indexOf(req.table) < 0) return fail('Data ini tidak boleh dihapus. Ubah status / batalkan saja.');
        const old = T(req.table).find(r => r.id === req.id);
        DB.lock(() => DB.remove(req.table, req.id));
        if (old && NO_LOG.indexOf(req.table) < 0) log(who, 'Hapus', req.table, req.id, describe(req.table, old));
        return ok();
      }
      case 'saveSettings': {
        if (!owner) return fail('Hanya pemilik yang dapat mengubah pengaturan.');
        const cur = settings(), inc = req.settings || {};
        const d = Object.keys(inc).filter(k => String(cur[k]) !== String(inc[k])).map(k => k).join(', ');
        DB.lock(() => DB.saveSettings(inc));
        if (d) log(who, 'Ubah', 'Pengaturan', '', d);
        return ok({ settings: settings() });
      }
      case 'changePassword': {
        if (u.passwordHash !== DB.hash(String(req.oldPass || ''))) return fail('Password lama salah.');
        if (String(req.newPass || '').length < 6) return fail('Password baru minimal 6 karakter.');
        DB.lock(() => DB.upsert('Users', [Object.assign({}, u, { passwordHash: DB.hash(String(req.newPass)) })]));
        log(who, 'Ubah', 'Users', u.id, 'Ganti password');
        return ok();
      }
      case 'saveUser': {
        if (!owner) return fail('Hanya pemilik yang dapat mengelola pengguna.');
        const r = req.row || {}, users = T('Users');
        const uname = String(r.username || '').trim().toLowerCase();
        if (!uname || !String(r.nama || '').trim()) return fail('Username & nama wajib diisi.');
        if (users.some(x => x.id !== r.id && String(x.username).toLowerCase() === uname)) return fail('Username sudah dipakai.');
        const old = r.id ? users.find(x => x.id === r.id) : null;
        if (!old && String(r.password || '').length < 6) return fail('Password minimal 6 karakter.');
        const row = Object.assign({}, old || {}, { username: uname, nama: String(r.nama).trim(), akses: r.akses === 'Pemilik' ? 'Pemilik' : 'Admin', cabang: r.akses === 'Pemilik' ? '' : String(r.cabang || ''), keuangan: r.keuangan === 'Tidak' ? 'Tidak' : 'Ya', status: r.status === 'Nonaktif' ? 'Nonaktif' : 'Aktif' });
        if (r.password) { if (String(r.password).length < 6) return fail('Password minimal 6 karakter.'); row.passwordHash = DB.hash(String(r.password)); }
        if (old && old.akses === 'Pemilik' && (row.akses !== 'Pemilik' || row.status === 'Nonaktif') && users.filter(x => x.akses === 'Pemilik' && x.status !== 'Nonaktif').length < 2) return fail('Minimal harus ada satu pemilik aktif.');
        const saved = DB.lock(() => DB.upsert('Users', [row]))[0];
        log(who, old ? 'Ubah' : 'Tambah', 'Users', saved.id, (old ? diff(old, row) : 'username: ' + uname + ' · akses: ' + row.akses) + (r.password && old ? ' · reset password' : ''));
        return ok({ users: T('Users').map(safeUser) });
      }
      case 'removeUser': {
        if (!owner) return fail('Hanya pemilik yang dapat mengelola pengguna.');
        if (req.id === u.id) return fail('Tidak bisa menghapus akun sendiri.');
        const old = T('Users').find(x => x.id === req.id);
        DB.lock(() => DB.remove('Users', req.id));
        if (old) log(who, 'Hapus', 'Users', req.id, 'username: ' + old.username);
        return ok({ users: T('Users').map(safeUser) });
      }
      case 'log': {
        if (!owner) return fail('Hanya pemilik yang dapat melihat riwayat aktivitas.');
        return ok({ rows: T('Log').sort((x, y) => String(y.waktu).localeCompare(String(x.waktu))).slice(0, 1000) });
      }
    }
    return fail('Aksi tidak dikenal: ' + a);
  }

  function bootstrap(u) {
    if (DB.beforeLogin) DB.beforeLogin();
    const db = {};
    DATA_TABLES.forEach(t => db[t] = T(t));
    const c = u.cabang;
    if (c) {
      CAB_TABLES.forEach(t => db[t] = db[t].filter(r => r.cabang === c));
      const sIds = {}; db.Siswa.forEach(s => sIds[s.id] = 1);
      ['SiswaProgram', 'Perkembangan', 'Laporan'].forEach(t => db[t] = db[t].filter(r => sIds[r.siswaId]));
      db.Guru = db.Guru.filter(g => !g.cabang || list(g.cabang).indexOf(c) > -1);
      const gIds = {}; db.Guru.forEach(g => gIds[g.id] = 1);
      db.Gaji = db.Gaji.filter(r => gIds[r.guruId]);
      db.AbsensiGuru = db.AbsensiGuru.filter(r => gIds[r.guruId]);
    }
    const out = { db: db, settings: settings(), me: safeUser(u) };
    if (isOwner(u)) out.users = T('Users').map(safeUser);
    return out;
  }

  /* ---------- GURU ---------- */
  function scopeOf(g) {
    const cabs = list(g.cabang);
    const jad = T('Jadwal').filter(j => j.guruId === g.id && j.status !== 'Nonaktif');
    const diajar = {}; jad.forEach(j => list(j.siswaIds).forEach(x => diajar[x] = 1));
    const siswa = T('Siswa').filter(s => s.status === 'Aktif' && (diajar[s.id] || !cabs.length || cabs.indexOf(s.cabang) > -1));
    const ids = {}; siswa.forEach(s => ids[s.id] = s);
    return { cabs: cabs, jad: jad, diajar: diajar, siswa: siswa, ids: ids };
  }
  const cutoff = days => { const d = new Date(Date.now() - days * 864e5); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  function guruRoute(g, req) {
    const a = req.action;
    if (a === 'guruData') {
      const sc = scopeOf(g), c62 = cutoff(62), c150 = cutoff(150);
      const safe = Object.assign({}, g); delete safe.pin; delete safe.tarif; delete safe.tipeTarif;
      return ok({ data: {
        guru: safe, settings: pubSettings(),
        Program: T('Program'),
        Siswa: sc.siswa.map(s => ({ id: s.id, nama: s.nama, panggilan: s.panggilan, jk: s.jk, kelas: s.kelas, cabang: s.cabang, tglLahir: s.tglLahir, status: s.status, ortu: s.ortu, diajar: sc.diajar[s.id] ? '1' : '' })),
        SiswaProgram: T('SiswaProgram').filter(r => sc.ids[r.siswaId]),
        Jadwal: sc.jad,
        Absensi: T('Absensi').filter(r => r.tanggal >= c62 && sc.ids[r.siswaId]),
        AbsensiGuru: T('AbsensiGuru').filter(r => r.guruId === g.id),
        Perkembangan: T('Perkembangan').filter(r => r.tanggal >= c150 && sc.ids[r.siswaId]),
        Laporan: T('Laporan').filter(r => sc.ids[r.siswaId])
      } });
    }
    if (a === 'guruAbsen') return ok({ row: DB.lock(() => {
      const tgl = DB.today(), hm = DB.nowHM();
      const row = T('AbsensiGuru').find(r => r.guruId === g.id && r.tanggal === tgl) || { tanggal: tgl, guruId: g.id, status: '', jamMasuk: '', jamKeluar: '', jamMengajar: '', cabang: list(g.cabang)[0] || '', catatan: '' };
      if (req.mode === 'masuk') { row.status = 'Hadir'; if (!row.jamMasuk) row.jamMasuk = hm; }
      else if (req.mode === 'pulang') {
        row.status = 'Hadir'; if (!row.jamMasuk) row.jamMasuk = hm; row.jamKeluar = hm;
        const x = row.jamMasuk.split(':').map(Number), y = row.jamKeluar.split(':').map(Number);
        const d = ((y[0] * 60 + y[1]) - (x[0] * 60 + x[1])) / 60; row.jamMengajar = d > 0 ? String(Math.round(d * 2) / 2) : '0';
      } else if (req.mode === 'Izin' || req.mode === 'Sakit') { row.status = req.mode; row.jamMengajar = '0'; }
      if (req.cabang) row.cabang = String(req.cabang);
      return DB.upsert('AbsensiGuru', [row])[0];
    }) });
    if (a === 'guruSaveAbsensi') return ok({ rows: DB.lock(() => {
      const sc = scopeOf(g), ex = T('Absensi');
      const out = (req.rows || []).filter(r => sc.ids[r.siswaId] && /^\d{4}-\d{2}-\d{2}$/.test(r.tanggal) && ABS_STATUS.indexOf(r.status) > -1 && r.programId).map(r => {
        const e = ex.find(x => x.tanggal === r.tanggal && x.siswaId === r.siswaId && x.programId === r.programId);
        const o = { tanggal: r.tanggal, jadwalId: String(r.jadwalId || ''), programId: String(r.programId), cabang: sc.ids[r.siswaId].cabang, siswaId: r.siswaId, status: r.status, guruId: g.id, tipe: r.tipe === 'Pengganti' ? 'Pengganti' : 'Reguler', catatan: String(r.catatan || '') };
        if (e) o.id = e.id; return o;
      });
      return DB.upsert('Absensi', out);
    }) });
    if (a === 'guruSaveProgress') return ok({ rows: DB.lock(() => {
      const sc = scopeOf(g), ex = T('Perkembangan');
      const out = (req.rows || []).filter(r => sc.ids[r.siswaId] && String(r.deskripsi || '').trim()).map(r => {
        const e = r.id ? ex.find(x => x.id === r.id && x.guruId === g.id) : null;
        const o = { tanggal: r.tanggal || DB.today(), siswaId: r.siswaId, programId: String(r.programId || ''), level: String(r.level || ''), guruId: g.id, deskripsi: String(r.deskripsi).trim() };
        if (e) o.id = e.id; return o;
      });
      return DB.upsert('Perkembangan', out);
    }) });
    if (a === 'guruDelProgress') { DB.lock(() => { const e = T('Perkembangan').find(x => x.id === req.id && x.guruId === g.id); if (e) DB.remove('Perkembangan', e.id); }); return ok(); }
    if (a === 'guruSaveLaporan') return ok({ row: DB.lock(() => {
      const sc = scopeOf(g), r = req.row || {};
      if (!sc.ids[r.siswaId] || !r.programId || !/^\d{4}-\d{2}$/.test(r.periode || '')) throw new Error('Data laporan tidak valid.');
      const e = T('Laporan').find(x => x.siswaId === r.siswaId && x.programId === r.programId && x.periode === r.periode);
      const o = clean('Laporan', r); o.guruId = g.id; o.dibuat = DB.today(); if (e) o.id = e.id; else delete o.id;
      return writeRows(g.nama + ' (guru)', 'Laporan', [o])[0];
    }) });
    return fail('Akses ditolak');
  }

  /* ---------- ORANG TUA ---------- */
  function me(sid) {
    const s = T('Siswa').find(r => r.id === sid);
    if (!s) throw new Error('Data siswa tidak ditemukan');
    const mine = t => T(t).filter(r => r.siswaId === sid);
    const guru = T('Guru'); const gn = id => (guru.find(x => x.id === id) || {}).nama || '';
    const safe = Object.assign({}, s); delete safe.kodeOrtu;
    return {
      siswa: safe, settings: pubSettings(),
      Program: T('Program'),
      SiswaProgram: mine('SiswaProgram'),
      Absensi: mine('Absensi'),
      Kas: mine('Kas').filter(k => !k.batal).map(k => ({ id: k.id, noKuitansi: k.noKuitansi, tanggal: k.tanggal, jenis: k.jenis, kategori: k.kategori, siswaId: k.siswaId, programId: k.programId, periode: k.periode, refId: k.refId, nominal: k.nominal, metode: k.metode, keterangan: k.keterangan, cabang: k.cabang, batal: '' })),
      Penjualan: mine('Penjualan').filter(p => !p.batal),
      Perkembangan: mine('Perkembangan').map(p => Object.assign({}, p, { guruNama: gn(p.guruId) })),
      Laporan: mine('Laporan').map(p => Object.assign({}, p, { guruNama: gn(p.guruId) })),
      Jadwal: T('Jadwal').filter(j => j.status !== 'Nonaktif' && list(j.siswaIds).indexOf(sid) > -1).map(j => Object.assign({}, j, { guruNama: gn(j.guruId) }))
    };
  }

  /* ---------- SETUP ---------- */
  function setup() {
    if (!T('Users').length) DB.upsert('Users', [{ username: 'admin', passwordHash: DB.hash('aheaksara123'), nama: 'Pemilik AHE Aksara', akses: 'Pemilik', cabang: '', keuangan: 'Ya', status: 'Aktif' }]);
    if (!T('Program').length) DB.upsert('Program', DEFAULT_PROGRAMS.map(p => Object.assign({}, p)));
    if (!T('Item').length) DB.upsert('Item', defaultItems_());
    DB.saveSettings({});
  }

  return { route: route, setup: setup };

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const DEMO = !IS_GAS && (!CONFIG.API_URL || /[?&]demo\b/.test(location.search));
const IS_SB = !IS_GAS && !DEMO && /supabase\.co/.test(CONFIG.API_URL);
const BACKEND = IS_GAS ? 'Google Spreadsheet' : IS_SB ? 'database Supabase' : DEMO ? 'browser (mode demo)' : 'server';

const SESS_KEY = DEMO ? 'aa_session_demo' : 'aa_session';
const S = { token: null, role: null, profile: null, db: {}, settings: {}, me: null, page: null, tab: {}, f: {}, cab: '' };

/* ---------------- storage aman ---------------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------------- API ---------------- */
async function call(action, payload = {}, opts = {}) {
  const req = Object.assign({ action, token: S.token }, payload);
  if (!opts.silent) loading(true);
  try {
    let res;
    if (IS_GAS) res = await new Promise((ok, ko) => google.script.run.withSuccessHandler(r => ok(JSON.parse(r))).withFailureHandler(ko).api(JSON.stringify(req)));
    else if (DEMO) { await new Promise(r => setTimeout(r, 90)); res = Mock.handle(JSON.parse(JSON.stringify(req))); }
    else {
      const headers = { 'Content-Type': 'application/json' };
      if (CONFIG.ANON_KEY) { headers.apikey = CONFIG.ANON_KEY; headers.Authorization = 'Bearer ' + CONFIG.ANON_KEY; }
      let r;
      try { r = await fetch(CONFIG.API_URL, { method: 'POST', headers: IS_SB ? headers : undefined, body: JSON.stringify(req) }); }
      catch (e) { throw new Error('Tidak bisa terhubung ke server. Periksa koneksi internet.'); }
      try { res = await r.json(); } catch (e) { throw new Error(`Server error (${r.status}). Pastikan Edge Function "api" sudah di-deploy.`); }
    }
    if (!res.ok) { if (res.error === 'SESSION') logout(true); throw new Error(res.message || res.error || 'Terjadi kesalahan'); }
    return res;
  } finally { if (!opts.silent) loading(false); }
}

const jsq = s => esc(String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));

const thisPeriod = () => todayStr().slice(0, 7);
const fmtDate = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return d ? `${+d} ${BULAN[+m - 1].slice(0, 3)} ${y}` : s; };
const fmtDateLong = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return d ? `${+d} ${BULAN[+m - 1]} ${y}` : s; };
const fmtPeriod = p => { if (!p) return '-'; const [y, m] = p.split('-'); return `${BULAN[+m - 1]} ${y}`; };
const fmtPeriodS = p => { if (!p) return '-'; const [y, m] = p.split('-'); return `${BULAN[+m - 1].slice(0, 3)} ${y.slice(2)}`; };
const addMonths = (p, n) => { let [y, m] = p.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const dayName = s => HARI[new Date(s + 'T00:00:00').getDay()];
const daysIn = p => new Date(+p.slice(0, 4), +p.slice(5, 7), 0).getDate();
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const rand4 = () => String(Math.floor(1000 + Math.random() * 9000));
const splitList = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const byName = (a, b) => String(a.nama).localeCompare(String(b.nama));

function waNum(n) { n = String(n || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); else if (n.startsWith('8')) n = '62' + n; return n; }
function waLink(n, text) { return `https://wa.me/${waNum(n)}?text=${encodeURIComponent(text)}`; }
function openWa(n, text) { if (!waNum(n)) return toast('Nomor WhatsApp belum diisi', true); window.open(waLink(n, text), '_blank'); }
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => o[k] = String(v).trim()); return o; }
function monthOptions(sel, back = 12, fwd = 1) {
  const cur = thisPeriod(); let out = '';
  for (let i = fwd; i >= -back; i--) { const p = addMonths(cur, i); out += `<option value="${p}" ${p === sel ? 'selected' : ''}>${fmtPeriod(p)}</option>`; }
  return out;
}
const opt = (arr, v) => arr.map(x => { const [val, lab] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('');
function downloadFile(name, content, type = 'text/csv;charset=utf-8') {
  try {
    const blob = new Blob([type.startsWith('text/csv') ? '﻿' + content : content], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast('Unduhan tidak didukung di tampilan ini', true); }
}
function toCSV(rows) { return rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n'); }
/* ekspor .xlsx (SheetJS dimuat saat dibutuhkan, cadangan: CSV) */
let _xlsx = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_xlsx) return _xlsx;
  return _xlsx = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = () => { _xlsx = null; ko(new Error('Gagal memuat modul Excel')); }; document.head.appendChild(s); });
}
async function exportXLSX(name, sheets) {
  try {
    loading(true); const X = await loadXLSX(); loading(false);
    const wb = X.utils.book_new();
    sheets.forEach(([title, rows]) => { const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = (rows[0] || []).map((_, i) => ({ wch: Math.min(40, Math.max(8, ...rows.slice(0, 200).map(r => String(r[i] == null ? '' : r[i]).length))) })); X.utils.book_append_sheet(wb, ws, title.slice(0, 31)); });
    X.writeFile(wb, name.endsWith('.xlsx') ? name : name + '.xlsx');
  } catch (e) {
    loading(false); toast('Excel tidak tersedia, diunduh sebagai CSV', true);
    sheets.forEach(([title, rows]) => downloadFile(`${name.replace(/\.xlsx$/, '')}-${title}.csv`, toCSV(rows)));
  }
}

/* ---------------- kirim dokumen sebagai GAMBAR / PDF (share ke WhatsApp) ---------------- */
const _libs = {};
function loadLib(key, url, get) {
  if (get()) return Promise.resolve(get());
  if (_libs[key]) return _libs[key];
  return _libs[key] = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = url; s.onload = () => ok(get()); s.onerror = () => { _libs[key] = null; ko(new Error('Gagal memuat modul')); }; document.head.appendChild(s); });
}
const loadH2C = () => loadLib('h2c', 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => window.html2canvas);
const loadPDF = () => loadLib('pdf', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => window.jspdf && window.jspdf.jsPDF);
const IMG = { blob: null, pdf: null, name: '', busy: null, wa: '', text: '' };
/* dipanggil saat dokumen dibuka: gambar & PDF disiapkan lebih dulu agar tombol share bisa langsung membuka menu Share (syarat iPhone) */
function prepImage(name, wa, text) {
  Object.assign(IMG, { blob: null, pdf: null, name: String(name).replace(/[^\w-]+/g, '-'), wa: wa || '', text: text || '' });
  const src = $('#modal .inv'); if (!src) return;
  const job = IMG.busy = (async () => {
    const h2c = await loadH2C();
    const box = document.createElement('div'); box.className = 'img-render';
    box.style.cssText = 'position:fixed;left:-10000px;top:0;width:640px;background:#fff';
    const clone = src.cloneNode(true); box.appendChild(clone); document.body.appendChild(box);
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; return await h2c(clone, { scale: 2, backgroundColor: '#ffffff', logging: false }); }
    finally { box.remove(); }
  })();
  const setBtn = (id, html, ok) => { const b = $('#' + id); if (b) { b.disabled = !ok; b.innerHTML = html; } };
  job.then(c => new Promise(r => c.toBlob(r, 'image/png'))).then(b => { if (IMG.busy !== job) return; IMG.blob = b; setBtn('imgBtn', ic('wa') + ' Kirim Gambar', true); })
     .catch(() => setBtn('imgBtn', 'Gambar tidak tersedia'));
  Promise.all([job, loadPDF()]).then(([c, JsPDF]) => {
    if (IMG.busy !== job) return;
    const m = 8, w = 148, h = Math.round(w * c.height / c.width);           /* lebar A5, tinggi mengikuti isi */
    const doc = new JsPDF({ unit: 'mm', format: [w + 2 * m, h + 2 * m], orientation: 'portrait', compress: true });
    doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, w, h);
    doc.setProperties({ title: IMG.name });
    IMG.pdf = doc.output('blob'); setBtn('pdfBtn', ic('file') + ' Kirim PDF', true);
  }).catch(() => setBtn('pdfBtn', 'PDF tidak tersedia'));
}
const imgBtn = () => `<button class="btn wa" id="pdfBtn" disabled onclick="sendDoc('pdf')">Menyiapkan PDF…</button><button class="btn wa" id="imgBtn" disabled onclick="sendDoc('img')">Menyiapkan gambar…</button>`;
async function sendDoc(kind) {
  const isPdf = kind === 'pdf', blob = isPdf ? IMG.pdf : IMG.blob;
  if (!blob) return toast((isPdf ? 'PDF' : 'Gambar') + ' belum siap, coba sebentar lagi', true);
  const file = new File([blob], (IMG.name || 'dokumen') + (isPdf ? '.pdf' : '.png'), { type: isPdf ? 'application/pdf' : 'image/png' });
  const btn0 = $(isPdf ? '#pdfBtn' : '#imgBtn');
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    /* teks disalin dulu (tanpa menunggu) — sebagian WhatsApp (iPhone, PDF, aplikasi Windows) tidak ikut mengirim keterangan */
    if (IMG.text && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(IMG.text).catch(() => {});
    try {
      await navigator.share({ files: [file], text: IMG.text });
      if (IMG.text && waNum(IMG.wa) && btn0) { btn0.innerHTML = ic('wa') + ' Kirim teksnya juga'; btn0.onclick = () => window.open(waLink(IMG.wa, IMG.text), '_blank'); }
      if (IMG.text) toast('Terkirim ✓ Kalau teks tidak ikut: tekan "Kirim teksnya juga" atau tempel (Paste) di chat');
      return;
    }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  /* laptop / browser tanpa Share: gambar disalin (tempel Ctrl+V), PDF diunduh (lampirkan sebagai Dokumen) */
  let copied = false;
  if (!isPdf) try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; } catch (e) {}
  if (!copied) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); }
  const btn = $(isPdf ? '#pdfBtn' : '#imgBtn');
  if (btn && waNum(IMG.wa)) { btn.innerHTML = ic('wa') + ' Buka chat WhatsApp'; btn.onclick = () => window.open(waLink(IMG.wa, IMG.text), '_blank'); }
  toast(copied ? 'Gambar disalin ✓ Buka chat WhatsApp lalu tempel (Ctrl+V)' : isPdf ? 'PDF diunduh ✓ Di chat WhatsApp klik 📎 → Dokumen → pilih file PDF' : 'Gambar diunduh ✓ Lampirkan di chat WhatsApp', false);
}
const sendImage = () => sendDoc('img');

let toastT;
function toast(msg, err) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', msg.length > 60 ? 6000 : 3000);
}
let loadingN = 0;
function loading(on) {
  loadingN += on ? 1 : -1; if (loadingN < 0) loadingN = 0;
  let l = $('#loading'); if (!l) { l = document.createElement('div'); l.id = 'loading'; l.className = 'loading hidden'; l.innerHTML = '<div class="spin"></div>'; document.body.appendChild(l); }
  l.classList.toggle('hidden', loadingN === 0);
}
function modal(title, body, foot = '', wide = false) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal-bg'; m.id = 'modal';
  m.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function confirmBox(msg, onYes, yesLabel = 'Ya, hapus') {
  window.__yes = () => { closeModal(); onYes(); };
  modal('Konfirmasi', `<p>${msg}</p>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn red" onclick="__yes()">${yesLabel}</button>`);
}
function promptBox(title, label, onOk, okLabel = 'Simpan', ph = '') {
  window.__ok = () => { const v = $('#pbIn').value.trim(); if (!v) return toast('Wajib diisi', true); closeModal(); onOk(v); };
  modal(title, `<div class="field"><label>${label}</label><input class="input" id="pbIn" placeholder="${esc(ph)}" onkeydown="if(event.key==='Enter')__ok()"></div>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn red" onclick="__ok()">${okLabel}</button>`);
  setTimeout(() => $('#pbIn') && $('#pbIn').focus(), 60);
}

  if (sp.tglSelesai) { const e = sp.tglSelesai.slice(0, 7); if (p > e) return false; if (p === e && !perPertemuan(sp) && sp.tglSelesai < dueOf(sp, p) && p !== start) return false; }

/* ---------- penyimpanan ---------- */
function replaceRows(t, rows) { rows.forEach(r => { const i = D(t).findIndex(x => x.id === r.id); i > -1 ? D(t)[i] = r : D(t).push(r); }); }
async function saveRow(t, row) { const r = await call('save', { table: t, row }); replaceRows(t, [r.row]); return r.row; }
async function saveRows(t, rows) { if (!rows.length) return []; const r = await call('saveMany', { table: t, rows }); replaceRows(t, r.rows); return r.rows; }
async function removeRow(t, id) { await call('remove', { table: t, id }); S.db[t] = D(t).filter(x => x.id !== id); }

    <div class="stat bg-teal"><span class="lbl">Hadir hari ini</span><span class="val num">${absToday.filter(a => a.status === 'Hadir').length}<small style="font-size:16px"> / ${absToday.length}</small></span><span class="sub">${jad.length} sesi terjadwal</span></div>

    </div>
    <div class="card"><div class="card-head"><h3>Stok buku menipis</h3><div class="spacer"></div><button class="btn sm ghost" onclick="go('stok')">Stok</button></div>
      ${low.length ? low.slice(0, 7).map(x => `<div class="li"><div class="meta"><b>${esc(x.it.nama)} · Level ${esc(x.it.level)}</b><span class="small muted">${esc(cabLabel())}</span></div><span class="badge ${x.n <= 0 ? 'b-red' : 'b-orange'}">${x.n} tersisa</span></div>`).join('') : '<div class="empty">Stok aman 👍</div>'}
    </div>
    </div>
  </div>
    ${!S.cab && !S.user.cabang ? `<div class="card"><h3>Ringkasan per cabang — ${fmtPeriod(p)}</h3><div class="table-wrap"><table class="t"><thead><tr><th>Cabang</th><th class="c">Aktif</th><th class="c">Baru</th><th class="c">Belum bayar</th>${canFin() ? '<th class="r">Masuk bln ini</th><th class="r">Keluar</th>' : ''}</tr></thead><tbody>
      ${cabList().map(c => { const a = D('Siswa').filter(s => s.cabang === c && s.status === 'Aktif'); return `<tr class="click" onclick="setCab('${jsq(c)}')"><td><b>${esc(c)}</b></td><td class="c num">${a.length}</td><td class="c num">${D('Siswa').filter(s => s.cabang === c && String(s.tglDaftar).startsWith(p)).length}</td><td class="c num">${a.filter(s => arrearsOf(s.id).length).length}</td>${canFin() ? `<td class="r num">${rp(sum(kasIn(monthRange(p), 'Masuk', c), k => k.nominal))}</td><td class="r num">${rp(sum(kasIn(monthRange(p), 'Keluar', c), k => k.nominal))}</td>` : ''}</tr>`; }).join('')}

async function saveSiswa(id) {
  const f = formData($('#fSiswa')), old = siswaById(id);
  const reakt = !!f.reaktivasi; delete f.reaktivasi;
  const row = Object.assign({}, old, f, { id });
  if (!row.ortu) row.ortu = row.ibu || row.ayah || '';
  const changed = f.status !== old.status;
  if (changed) row.tglStatus = f.tglStatus || todayStr(); else row.tglStatus = old.tglStatus;
  delete row.undefined;
  try {
    await saveRow('Siswa', row);
    if (changed && old.status === 'Aktif') {
      await saveRows('SiswaProgram', spAktif(id).map(sp => ({ ...sp, tglSelesai: row.tglStatus })));
    } else if (changed && f.status === 'Aktif') {
      const last = {}; spOf(id).forEach(sp => { if (!last[sp.programId] || sp.tglMulai > last[sp.programId].tglMulai) last[sp.programId] = sp; });
      const lastEnd = Object.values(last).map(x => x.tglSelesai).sort().pop();
      const re = Object.values(last).filter(sp => sp.tglSelesai && sp.tglSelesai === lastEnd);
      await saveRows('SiswaProgram', re.map(sp => ({ siswaId: id, programId: sp.programId, level: sp.level, tglMulai: row.tglStatus, tglSelesai: '', biaya: sp.biaya, catatan: 'Aktif kembali' })));
      if (reakt) await saveRow('Penjualan', { noNota: docNo('NT'), tanggal: row.tglStatus, siswaId: id, cabang: row.cabang, kategori: 'Re-aktivasi', itemId: '', programId: '', nama: 'Re-aktivasi', level: '', qty: '1', harga: String(+S.settings.biayaReaktivasi), total: String(+S.settings.biayaReaktivasi), catatan: '', batal: '' });
    }
    closeModal(); toast('Data siswa tersimpan'); renderAdmin();
  } catch (e) { toast(e.message, true); }
}

const sentWa = {};

function sppRekap() {
  const y = S.f.sppY || thisPeriod().slice(0, 4), cur = thisPeriod();
  const months = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`);
  const sids = [...new Set(D('SiswaProgram').filter(sp => months.some(m => spBilled(sp, m))).map(sp => sp.siswaId))].map(siswaById).filter(s => inCab(s.cabang)).sort(byName);
  let tot = 0, totN = 0, paidTot = 0;
  const body = sids.map(s => {
    let n = 0, t = 0;
    const cells = months.map(m => {
      const bs = spOf(s.id).filter(sp => spBilled(sp, m)).map(sp => billOf(sp, m)).filter(b => b.st !== '-');
      if (!bs.length || m > cur) return `<td class="c cell-na">·</td>`;
      paidTot += sum(bs, b => b.bayar);
      const open = bs.filter(b => b.open);
      if (!open.length) return `<td class="c cell-ok" title="${bs.map(b => progById(b.pid).nama + ': ' + b.st).join(', ')}">✓</td>`;
      n++; t += sum(open, b => b.sisa);
      return `<td class="c ${open.some(b => b.st === 'Sebagian') && open.length === bs.length ? 'cell-part' : 'cell-no'}" title="${open.map(b => progById(b.pid).nama + ': ' + b.st + ' ' + rp(b.sisa)).join(', ')}">${open.some(b => b.st === 'Sebagian') ? '½' : '✗'}</td>`;
    }).join('');
    tot += t; totN += n;
    return `<tr class="${n ? 'unpaid' : ''}"><td class="nowrap"><b>${esc(s.nama)}</b><div class="xs muted">${esc(progNamesOf(s.id))}</div></td>${cells}<td class="c num">${n ? `<b style="color:var(--red)">${n} bln</b>` : '<span class="cell-ok">Lunas</span>'}</td><td class="r num">${n ? rp(t) : '-'}</td></tr>`;
  }).join('');
  return `<div class="grid g3"><div class="stat bg-ok"><span class="lbl">SPP terbayar tahun ${y}</span><span class="val num">${rp(paidTot)}</span></div>
    <div class="stat bg-red"><span class="lbl" style="color:var(--red-d)">Total tunggakan</span><span class="val num" style="color:var(--red)">${rp(tot)}</span><span class="sub">${totN} bulan belum lunas</span></div>
    <div class="stat bg-yellow"><span class="lbl">Siswa menunggak</span><span class="val num">${sids.filter(s => months.some(m => m <= cur && spOf(s.id).some(sp => spBilled(sp, m) && billOf(sp, m).open))).length}</span><span class="sub">dari ${sids.length} siswa</span></div></div>
  <div class="card"><div class="card-head"><select class="input" style="max-width:130px" onchange="setF('sppY',this.value)">${[+y - 1, +y, +y + 1].map(v => `<option ${v == y ? 'selected' : ''}>${v}</option>`).join('')}</select><span class="small muted">✓ lunas · ½ sebagian · <span style="color:var(--red)">✗ belum</span> · · tidak ditagih</span><div class="spacer"></div></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th>${months.map(m => `<th class="c">${BULAN[+m.slice(5) - 1].slice(0, 3)}</th>`).join('')}<th class="c">Tunggakan</th><th class="r">Jumlah</th></tr></thead><tbody>${body || '<tr><td colspan="15"><div class="empty">Belum ada data</div></td></tr>'}</tbody></table></div></div>`;
}
function kuitansiGroups(filterFn) {
  const g = {};
  D('Kas').filter(k => k.jenis === 'Masuk' && k.noKuitansi && inCab(k.cabang) && (!filterFn || filterFn(k))).forEach(k => (g[k.noKuitansi] = g[k.noKuitansi] || []).push(k));
  return Object.entries(g).map(([no, ks]) => ({ no, ks, k0: ks[0], v: ks.filter(k => !k.batal) })).sort((a, b) => (b.k0.tanggal + b.no).localeCompare(a.k0.tanggal + a.no));
}

  </tbody></table></div></div>`;

/* ---------- kasir: terima pembayaran ---------- */
function bayarItems(sid, o = {}) {
  const items = [], seen = {};
  const push = (b, pre) => { const k = b.pid + '|' + b.p; if (seen[k]) return; seen[k] = 1; items.push({ key: 'S:' + k, type: 'SPP', b, label: `SPP ${progById(b.pid).nama} — ${fmtPeriod(b.p)}`, sub: `${b.st}${b.bayar ? ' · sudah ' + rp(b.bayar) : ''} · jatuh tempo ${fmtDate(b.due)}${perPertemuan(b.sp) ? ` · ${hadirCount(b.sid, b.pid, b.p)} pertemuan` : ''}`, sisa: b.sisa, pre }); };
  const cur = thisPeriod();
  billsOfSiswa(sid, cur).filter(b => b.open).forEach(b => push(b, o.bills ? o.bills.includes(b.pid + '|' + b.p) : !o.refs || (o.sppNow && b.p === cur)));
  const nx = addMonths(cur, 1);
  spAktif(sid).filter(sp => !perPertemuan(sp)).forEach(sp => { if (spBilled(sp, nx)) { const b = billOf(sp, nx); if (b.open) push(b, o.bills ? o.bills.includes(b.pid + '|' + nx) : false); } });
  D('Penjualan').filter(j => j.siswaId === sid && !j.batal).forEach(j => { const x = jualSt(j); if (x.sisa > 0) items.push({ key: 'J:' + j.id, type: 'J', j, label: `${j.nama}${j.level ? ' Level ' + j.level : ''}${+j.qty > 1 ? ' ×' + j.qty : ''}`, sub: `${j.kategori} · ${fmtDate(j.tanggal)}${x.bayar ? ' · sudah ' + rp(x.bayar) : ''}`, sisa: x.sisa, pre: o.refs ? o.refs.includes(j.id) : !o.bills }); });
  return items;
}
function formBayar(sid, o = {}) {
  const cand = siswaCab().filter(s => s.status !== 'Keluar' || s.id === sid).sort(byName);
  const s = sid ? siswaById(sid) : null;
  const items = s ? bayarItems(sid, o) : [];
  const part = S.settings.bayarSebagian !== 'Tidak';
  window.__bayarItems = items;

/* ================= KEUANGAN ================= */
function kRange() {
  const m = S.f.kMode || 'bulan';

}
function kasRows(r, jenis, cab = S.cab) { return D('Kas').filter(k => !k.batal && +k.nominal && k.tanggal >= r.a && k.tanggal <= r.b && (!jenis || k.jenis === jenis) && (!cab || k.cabang === cab)); }
function kControls() {

PAGES.keuangan = function () {
  const t = S.tab.keu || 'ringkas';
  return `<div class="row">${tabs('keu', [['ringkas', 'Ringkasan'], ['trx', 'Transaksi'], ['lap', 'Laporan']], 'ringkas')}<div class="spacer"></div><button class="btn ghost" onclick="formKas('Masuk')">${ic('plus')} Pemasukan</button><button class="btn" onclick="formKas('Keluar')">${ic('minus')} Pengeluaran</button></div>

};
function groupSum(rows, key) { const o = {}; rows.forEach(r => o[r[key]] = (o[r[key]] || 0) + (+r.nominal || 0)); return Object.entries(o).sort((a, b) => b[1] - a[1]); }
function keuSeries(r) {
  if (r.m === 'tahun') return Array.from({ length: 12 }, (_, i) => { const p = `${r.y}-${pad(i + 1)}`; return { l: BULAN[i].slice(0, 3), i: sum(kasRows({ a: p + '-01', b: p + '-31' }, 'Masuk'), k => k.nominal), o: sum(kasRows({ a: p + '-01', b: p + '-31' }, 'Keluar'), k => k.nominal) }; });
  if (r.m === 'bulan') return Array.from({ length: daysIn(r.p) }, (_, i) => { const d = `${r.p}-${pad(i + 1)}`; return { l: String(i + 1), i: sum(kasRows({ a: d, b: d }, 'Masuk'), k => k.nominal), o: sum(kasRows({ a: d, b: d }, 'Keluar'), k => k.nominal) }; });
  return [];
}
function keuRingkas() {
  const r = kRange(), mIn = kasRows(r, 'Masuk'), mOut = kasRows(r, 'Keluar');

  const saldoAkhir = sum(kasRows({ a: '0000', b: r.b }, 'Masuk'), k => k.nominal) - sum(kasRows({ a: '0000', b: r.b }, 'Keluar'), k => k.nominal);
  const gi = groupSum(mIn, 'kategori'), go = groupSum(mOut, 'kategori');

  return `<div class="grid g4">
    <div class="stat bg-pri"><span class="lbl">Pemasukan</span><span class="val num" style="font-size:22px">${rp(tin)}</span><span class="sub">${mIn.length} transaksi</span></div>
    <div class="stat bg-coral"><span class="lbl">Pengeluaran</span><span class="val num" style="font-size:22px">${rp(tout)}</span><span class="sub">${mOut.length} transaksi</span></div>

  </div>
  ${ser.length ? `<div class="card"><div class="row"><h3 style="margin:0">${r.m === 'tahun' ? 'Per bulan' : 'Per hari'}</h3><div class="spacer"></div><div class="legend"><span><i style="background:var(--pri)"></i>Pemasukan</span><span><i style="background:var(--coral)"></i>Pengeluaran</span></div></div>

  ${!S.cab ? `<div class="card"><h3>Per cabang</h3><div class="table-wrap"><table class="t"><thead><tr><th>Cabang</th><th class="r">Pemasukan</th><th class="r">Pengeluaran</th><th class="r">Selisih</th></tr></thead><tbody>
    ${cabList().map(c => { const i = sum(kasRows(r, 'Masuk', c), k => k.nominal), o = sum(kasRows(r, 'Keluar', c), k => k.nominal); return `<tr class="click" onclick="setCab('${jsq(c)}')"><td><b>${esc(c)}</b></td><td class="r num">${rp(i)}</td><td class="r num">${rp(o)}</td><td class="r num"><b style="color:${i - o >= 0 ? 'var(--ok)' : 'var(--red)'}">${rp(i - o)}</b></td></tr>`; }).join('')}
  </tbody><tfoot><tr><td>Gabungan</td><td class="r num">${rp(tin)}</td><td class="r num">${rp(tout)}</td><td class="r num">${rp(tin - tout)}</td></tr></tfoot></table></div></div>` : ''}`;
}

function gajiCalc(g, p) {
  const r = D('AbsensiGuru').filter(a => a.guruId === g.id && a.tanggal.startsWith(p));
  const hadir = r.filter(x => x.status === 'Hadir').length, jam = sum(r, x => x.jamMengajar), meet = meetKeys(g.id, p).size;
  const tarif = +g.tarif || 0, tipe = g.tipeTarif || 'Per pertemuan';
  const pokok = tipe === 'Per pertemuan' ? tarif * meet : tipe === 'Per jam' ? Math.round(tarif * jam) : tipe === 'Bulanan tetap' ? tarif : tarif * hadir;
  const rec = D('Gaji').find(x => x.guruId === g.id && x.periode === p);
  const bonus = +(rec && rec.bonus) || 0, pot = +(rec && rec.potongan) || 0;
  const paid = !!(rec && rec.tanggalBayar);
  return { hadir, jam, meet, tarif, tipe, pokok, bonus, pot, total: paid ? +rec.total : pokok + bonus - pot, rec, paid, basis: tipe === 'Per pertemuan' ? `${meet} pertemuan` : tipe === 'Per jam' ? `${jam} jam` : tipe === 'Bulanan tetap' ? 'tetap' : `${hadir} hari` };
}

function siswaStat(p, cab) {

  const st = k => base.filter(s => s.status === k && String(s.tglStatus).startsWith(p));
  return { aktif, baru: base.filter(s => String(s.tglDaftar).startsWith(p)), cuti: st('Cuti'), keluar: st('Keluar'), lulus: st('Lulus') };
}

const pHero = (title, lines) => `<div class="hero"><span class="blob" style="width:150px;height:150px;right:-40px;top:-50px;background:#FE9249"></span><div class="avatar">${initials(title)}</div><div style="min-width:0"><h2>${esc(title)}</h2>${lines}</div>${stripe()}</div>`;

/* =========================================================
   PORTAL GURU
   ========================================================= */
function gSesiOptions(key, date) {
  const hari = dayName(date), ses = D('Jadwal').filter(j => j.hari === hari).sort((a, b) => a.jamMulai.localeCompare(b.jamMulai));
  let cur = S.f[key]; if (!cur || (cur !== 'pg' && cur !== 'mine' && !ses.find(j => j.id === cur))) cur = ses[0] ? ses[0].id : (key === 'gaJ' ? 'pg' : 'mine');
  S.f[key] = cur;
  return { cur, ses, html: `<select class="input" onchange="S.f['${key}']=this.value;renderGuru()">${ses.map(j => `<option value="${j.id}" ${cur === j.id ? 'selected' : ''}>${esc(j.jamMulai)}–${esc(j.jamSelesai)} · ${esc(progById(j.programId).nama)} · ${esc(j.cabang)}</option>`).join('')}${key === 'gaJ' ? `<option value="pg" ${cur === 'pg' ? 'selected' : ''}>➕ Pertemuan pengganti / di luar jadwal</option>` : `<option value="mine" ${cur === 'mine' ? 'selected' : ''}>Semua siswa yang saya ajar</option>`}</select>` };
}
function renderGuru() {
  const g = S.g.guru, t = S.tab.gp || 'absen', today = todayStr(), hari = dayName(today);
  const me = D('AbsensiGuru').find(a => a.tanggal === today);
  const jHari = D('Jadwal').filter(j => j.hari === hari).sort((a, b) => a.jamMulai.localeCompare(b.jamMulai));
  let absenBox;
  if (!me || !me.status) absenBox = `<p class="small" style="margin-bottom:10px">Anda belum absen hari ini.</p><div class="row"><button class="btn green" onclick="gAbsen('masuk')">${ic('clock')} Absen Masuk</button><button class="btn ghost sm" onclick="gAbsen('Izin')">Izin</button><button class="btn ghost sm" onclick="gAbsen('Sakit')">Sakit</button></div>`;
  else if (me.status === 'Hadir' && !me.jamKeluar) absenBox = `<p style="margin-bottom:10px"><span class="badge b-green">Hadir</span> Masuk pukul <b>${esc(me.jamMasuk)}</b></p><button class="btn" onclick="gAbsen('pulang')">${ic('logout')} Absen Pulang</button>`;
  else if (me.status === 'Hadir') absenBox = `<p><span class="badge b-green">✓ Selesai</span> Masuk <b>${esc(me.jamMasuk)}</b> · Pulang <b>${esc(me.jamKeluar)}</b> · <b>${esc(me.jamMengajar)} jam</b></p><button class="btn sm ghost" style="margin-top:8px" onclick="gAbsen('pulang')">Perbarui jam pulang</button>`;
  else absenBox = `<p><span class="badge ${absCls[me.status] || 'b-gray'}">${esc(me.status)}</span> hari ini</p><button class="btn sm ghost" style="margin-top:8px" onclick="gAbsen('masuk')">Ubah jadi Hadir (absen masuk)</button>`;
  const body = { absen: gTabAbsen, harian: gTabHarian, lap: gTabLap, jadwal: gTabJadwal, riwayat: gTabRiwayat }[t]();
  $('#app').innerHTML = pTop('Portal Guru') + `<div class="p-wrap">
    ${pHero(g.nama, `<p>${esc(g.id)} · Guru ${esc(g.jenis || 'AHE')} · ${esc(g.cabang || '')}</p><p class="small">${hari}, ${fmtDateLong(today)}</p>`)}
    <div class="grid g2">
      <div class="card"><h3>Absen saya hari ini</h3>${absenBox}</div>
      <div class="card"><h3>Jadwal mengajar hari ini</h3>${jHari.map(j => `<div class="li"><div class="avatar" style="background:${progColor(j.programId)}">${esc(j.jamMulai.slice(0, 2))}</div><div class="meta"><b>${esc(j.jamMulai)}–${esc(j.jamSelesai)} · ${esc(progById(j.programId).nama)}</b><span class="small muted">${esc(j.cabang)} · ${splitList(j.siswaIds).map(id => esc(siswaById(id).panggilan || siswaById(id).nama)).join(', ')}</span></div></div>`).join('') || '<div class="empty" style="padding:12px">Tidak ada jadwal hari ini</div>'}</div>
    </div>
    <div class="row">${tabs('gp', [['absen', 'Absensi Siswa'], ['harian', 'Catatan Perkembangan'], ['lap', 'Laporan Belajar'], ['jadwal', 'Jadwal & Siswa'], ['riwayat', 'Riwayat Absen Saya']], 'absen', 'renderGuru()')}</div>
    ${body}
  </div>`;
}
async function gAbsen(mode) {
  try { const r = await call('guruAbsen', { mode }); const i = D('AbsensiGuru').findIndex(a => a.id === r.row.id); i > -1 ? D('AbsensiGuru')[i] = r.row : D('AbsensiGuru').push(r.row); toast(mode === 'masuk' ? 'Absen masuk tercatat ✓' : mode === 'pulang' ? 'Absen pulang tercatat ✓' : 'Tercatat'); renderGuru(); }
  catch (e) { toast(e.message, true); }
}
const gProgs = () => { const ids = new Set(D('Jadwal').map(j => j.programId)); D('SiswaProgram').forEach(sp => ids.add(sp.programId)); return progs().filter(p => ids.has(p.id)); };

function gTabAbsen() {
  const date = S.f.gaDate || todayStr(), o = gSesiOptions('gaJ', date);
  const jad = o.ses.find(j => j.id === o.cur);
  const pid = jad ? jad.programId : (S.f.gaPg || (gProgs()[0] || {}).id), cab = jad ? jad.cabang : (S.f.gaCab || gCabs()[0]);
  const list = sesiSiswa({ jadwal: jad, programId: pid, cabang: cab });
  const key = `${date}|${o.cur}|${pid}|${cab}`;
  if (!S.gaDraft || S.gaDraft._k !== key) { S.gaDraft = { _k: key }; D('Absensi').filter(a => a.tanggal === date && a.programId === pid).forEach(a => S.gaDraft[a.siswaId] = { status: a.status, catatan: a.catatan }); }
  return `<div class="card"><div class="card-head">
    <div class="field"><label>Tanggal</label><input class="input" type="date" value="${date}" max="${todayStr()}" onchange="S.f.gaDate=this.value;renderGuru()"></div>
    <div class="field" style="flex:1;min-width:220px"><label>Sesi</label>${o.html}</div>
    ${jad ? '' : `<div class="field"><label>Program</label><select class="input" onchange="S.f.gaPg=this.value;renderGuru()">${opt(gProgs().map(p => [p.id, p.nama]), pid)}</select></div><div class="field"><label>Cabang</label><select class="input" onchange="S.f.gaCab=this.value;renderGuru()">${opt(gCabs(), cab)}</select></div>`}</div>
    ${list.map(s => { const d = S.gaDraft[s.id] || {}; return `<div class="li" style="flex-wrap:wrap"><div class="meta" style="min-width:150px"><b>${esc(s.nama)}</b><span class="small muted">${esc(s.kelas || '')} · ${esc(spAktif(s.id).filter(sp => sp.programId === pid).map(sp => 'Lv ' + sp.level).join('') || '')}</span></div>
      <div class="seg">${Object.entries(ABS).map(([k, v]) => `<button class="${k} ${d.status === v ? 'on' : ''}" onclick="gaSet('${s.id}','${v}')">${k}</button>`).join('')}</div>
      <input class="input" style="flex-basis:100%;padding:7px 10px" placeholder="Keterangan (opsional)" value="${esc(d.catatan || '')}" onchange="(S.gaDraft['${s.id}']=S.gaDraft['${s.id}']||{}).catatan=this.value"></div>`; }).join('') || '<div class="empty">Tidak ada siswa di sesi ini.</div>'}
    <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="gaAll()">✓ Semua Hadir</button><div class="spacer"></div><button class="btn" onclick="gaSave()">Simpan Absensi</button></div>
    <p class="small muted" style="margin-top:8px">H = Hadir · I = Izin · S = Sakit · A = Tanpa keterangan${jad ? '' : ' · tercatat sebagai pertemuan pengganti'}</p></div>`;
}
function gaSet(id, v) { S.gaDraft[id] = Object.assign(S.gaDraft[id] || {}, { status: v }); renderGuru(); }
function gaCtx() { const [date, jv, pid, cab] = S.gaDraft._k.split('|'); const jad = D('Jadwal').find(j => j.id === jv); return { date, jad, pid, cab, list: sesiSiswa({ jadwal: jad, programId: pid, cabang: cab }) }; }
function gaAll() { gaCtx().list.forEach(s => { if (!(S.gaDraft[s.id] || {}).status) S.gaDraft[s.id] = Object.assign(S.gaDraft[s.id] || {}, { status: 'Hadir' }); }); renderGuru(); }
async function gaSave() {
  const c = gaCtx();
  const rows = c.list.filter(s => (S.gaDraft[s.id] || {}).status).map(s => ({ tanggal: c.date, jadwalId: c.jad ? c.jad.id : '', programId: c.pid, siswaId: s.id, status: S.gaDraft[s.id].status, tipe: c.jad ? 'Reguler' : 'Pengganti', catatan: S.gaDraft[s.id].catatan || '' }));
  if (!rows.length) return toast('Pilih status kehadiran dulu', true);
  try { const r = await call('guruSaveAbsensi', { rows }); replaceRows('Absensi', r.rows); toast(`Absensi ${fmtDate(c.date)} tersimpan (${r.rows.length} siswa)`); renderGuru(); } catch (e) { toast(e.message, true); }
}
function gTabHarian() {
  const date = S.f.gpDate || todayStr(), o = gSesiOptions('gpJ', date), jad = o.ses.find(j => j.id === o.cur);
  const list = jad ? sesiSiswa({ jadwal: jad }) : D('Siswa').filter(s => s.diajar).sort(byName);
  const mine = D('Perkembangan').filter(p => p.guruId === S.g.guru.id);
  const recent = [...D('Perkembangan')].sort((a, b) => b.tanggal.localeCompare(a.tanggal)).slice(0, 12);
  return `<div class="card"><div class="card-head">
    <div class="field"><label>Tanggal</label><input class="input" type="date" value="${date}" max="${todayStr()}" onchange="S.f.gpDate=this.value;renderGuru()"></div>
    <div class="field" style="flex:1;min-width:220px"><label>Kelas / sesi</label>${o.html}</div></div>
    <p class="small muted" style="margin-bottom:8px">Tulis perkembangan belajar setiap anak. Catatan tampil di Portal Orang Tua & jadi bahan laporan bulanan.</p>
    <form id="fGP" onsubmit="event.preventDefault();gpSave()">
    ${list.map(s => { const sps = spAktif(s.id); const pid0 = jad ? jad.programId : (sps[0] || {}).programId; const ex = mine.find(p => p.tanggal === date && p.siswaId === s.id && (!jad || p.programId === pid0)) || {}; const pid = ex.programId || pid0; return `<div class="box" style="margin-bottom:10px" data-sid="${s.id}" data-id="${esc(ex.id || '')}">
      <div class="row" style="margin-bottom:8px"><b style="flex:1">${esc(s.nama)}</b><select class="input sm" name="programId">${opt(sps.map(sp => [sp.programId, progLabel(sp)]), pid)}</select></div>
      <textarea class="input" name="deskripsi" style="min-height:64px" placeholder="mis. Sudah lancar membaca suku kata, perlu latihan huruf mati…">${esc(ex.deskripsi || '')}</textarea></div>`; }).join('') || '<div class="empty">Tidak ada siswa.</div>'}
    ${list.length ? '<div class="row"><div class="spacer"></div><button class="btn">Simpan Catatan</button></div>' : ''}</form></div>
  <div class="card"><h3>Catatan terbaru</h3>${recent.map(p => `<div class="li" style="align-items:flex-start"><div class="meta"><b>${esc(siswaById(p.siswaId).nama)} ${progChip(p.programId)}</b><div style="white-space:pre-line">${esc(p.deskripsi)}</div><span class="small muted">${fmtDate(p.tanggal)}${p.guruId !== S.g.guru.id ? ' · guru lain' : ''}</span></div>${p.guruId === S.g.guru.id ? `<button class="icon-btn" onclick="gpDel('${p.id}')">${ic('trash')}</button>` : ''}</div>`).join('') || '<div class="empty">Belum ada catatan</div>'}</div>`;
}
async function gpSave() {
  const date = S.f.gpDate || todayStr();
  const rows = $$('#fGP [data-sid]').map(el => { const pid = el.querySelector('[name=programId]').value, sp = spAktif(el.dataset.sid).find(x => x.programId === pid) || {}; return { id: el.dataset.id || '', tanggal: date, siswaId: el.dataset.sid, programId: pid, level: sp.level || '', deskripsi: el.querySelector('[name=deskripsi]').value.trim() }; }).filter(r => r.deskripsi);
  if (!rows.length) return toast('Tulis minimal satu catatan', true);
  try { const r = await call('guruSaveProgress', { rows }); replaceRows('Perkembangan', r.rows); toast(`${r.rows.length} catatan tersimpan ✓`); renderGuru(); } catch (e) { toast(e.message, true); }
}
function gpDel(id) { confirmBox('Hapus catatan ini?', async () => { try { await call('guruDelProgress', { id }); S.g.Perkembangan = D('Perkembangan').filter(p => p.id !== id); renderGuru(); } catch (e) { toast(e.message, true); } }); }
function gTabLap() {
  const p = S.f.glP || thisPeriod();
  const pairs = []; const seen = {};
  D('Jadwal').forEach(j => splitList(j.siswaIds).forEach(sid => { const k = sid + j.programId; if (!seen[k] && D('Siswa').some(s => s.id === sid)) { seen[k] = 1; pairs.push({ s: siswaById(sid), pid: j.programId }); } }));
  pairs.sort((a, b) => byName(a.s, b.s));
  return `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="S.f.glP=this.value;renderGuru()">${monthOptions(p, 6, 0)}</select><div class="spacer"></div><span class="small muted">${pairs.filter(x => D('Laporan').some(l => l.siswaId === x.s.id && l.programId === x.pid && l.periode === p)).length}/${pairs.length} laporan dibuat</span></div>
  ${pairs.map(({ s, pid }) => { const l = D('Laporan').find(x => x.siswaId === s.id && x.programId === pid && x.periode === p); return `<div class="li"><div class="avatar" style="background:${progColor(pid)}">${initials(s.nama)}</div><div class="meta"><b>${esc(s.nama)}</b><span class="small muted">${esc(progById(pid).nama)} · ${l ? 'Sudah dibuat' : 'Belum dibuat'}</span></div>${l ? `<button class="icon-btn" onclick="viewLaporan('${l.id}')">${ic('eye')}</button>` : ''}<button class="btn sm ${l ? 'ghost' : ''}" onclick="gFormLap('${s.id}','${pid}','${p}')">${l ? 'Edit' : 'Buat'}</button></div>`; }).join('') || '<div class="empty">Belum ada siswa di jadwal Anda</div>'}</div>`;
}
function gFormLap(sid, pid, p) { const l = D('Laporan').find(x => x.siswaId === sid && x.programId === pid && x.periode === p); laporanForm(sid, pid, p, l, `gSaveLap('${sid}','${pid}','${p}')`); }
async function gSaveLap(sid, pid, p) {
  try { const r = await call('guruSaveLaporan', { row: laporanRow(sid, pid, p) }); replaceRows('Laporan', [r.row]); closeModal(); toast('Laporan tersimpan ✓'); renderGuru(); viewLaporan(r.row.id); } catch (e) { toast(e.message, true); }
}
function gTabJadwal() {
  const js = D('Jadwal').slice().sort((a, b) => HARI_LES.indexOf(a.hari) - HARI_LES.indexOf(b.hari) || a.jamMulai.localeCompare(b.jamMulai));
  const mine = D('Siswa').filter(s => s.diajar).sort(byName);
  return `<div class="grid g2"><div class="card"><h3>Jadwal mengajar mingguan</h3>${js.map(j => `<div class="li"><div class="avatar" style="background:${progColor(j.programId)};font-size:11px">${esc(j.hari.slice(0, 3))}</div><div class="meta"><b>${esc(j.hari)} ${esc(j.jamMulai)}–${esc(j.jamSelesai)}</b><span class="small muted">${esc(progById(j.programId).nama)} · ${esc(j.cabang)} · ${splitList(j.siswaIds).length} siswa</span></div></div>`).join('') || '<div class="empty">Belum ada jadwal</div>'}</div>
  <div class="card"><h3>Siswa yang saya ajar (${mine.length})</h3>${mine.map(s => `<div class="li"><div class="avatar">${initials(s.nama)}</div><div class="meta"><b>${esc(s.nama)}${s.panggilan ? ` (${esc(s.panggilan)})` : ''}</b><span class="small muted">${esc(s.kelas || '')} · ${esc(s.cabang)} · ${spAktif(s.id).map(progLabel).map(esc).join(', ')}</span></div></div>`).join('') || '<div class="empty">Admin mengatur pembagian siswa di menu Jadwal Les.</div>'}</div></div>`;
}
function gTabRiwayat() {
  const p = S.f.grP || thisPeriod();
  const rows = D('AbsensiGuru').filter(a => a.tanggal.startsWith(p)).sort((a, b) => b.tanggal.localeCompare(a.tanggal));
  const meet = new Set(D('Absensi').filter(a => a.guruId === S.g.guru.id && a.tanggal.startsWith(p)).map(a => a.tanggal + (a.jadwalId || a.programId))).size;
  return `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="S.f.grP=this.value;renderGuru()">${monthOptions(p, 6, 0)}</select></div>
    <div class="grid g3" style="margin-bottom:10px"><div class="stat bg-ok"><span class="lbl">Hari hadir</span><span class="val num">${rows.filter(r => r.status === 'Hadir').length}</span></div><div class="stat bg-pri"><span class="lbl">Pertemuan</span><span class="val num">${meet}</span></div><div class="stat bg-teal"><span class="lbl">Jam mengajar</span><span class="val num">${sum(rows, r => r.jamMengajar)}</span></div></div>
    ${rows.map(r => `<div class="li"><div class="meta"><b>${dayName(r.tanggal)}, ${fmtDate(r.tanggal)}</b><span class="small muted">${r.jamMasuk ? `${esc(r.jamMasuk)}–${esc(r.jamKeluar || '…')} · ${esc(r.jamMengajar || 0)} jam` : ''}${r.cabang ? ' · ' + esc(r.cabang) : ''}</span></div><span class="badge ${absCls[r.status] || 'b-gray'}">${esc(r.status)}</span></div>`).join('') || '<div class="empty">Belum ada absen di bulan ini</div>'}</div>`;
}

/* =========================================================
   PORTAL ORANG TUA
   ========================================================= */
function renderOrtu() {
  const s = S.me.siswa, st = S.settings, p = thisPeriod(), t = S.tab.ortu || 'ringkas';
  const tg = tagihanItems(s.id);
  const ab = D('Absensi').filter(a => a.tanggal.startsWith(p));
  const laps = [...D('Laporan')].sort((a, b) => b.periode.localeCompare(a.periode));
  const notes = [...D('Perkembangan')].sort((a, b) => b.tanggal.localeCompare(a.tanggal));
  const noteItem = h => `<div class="li" style="align-items:flex-start"><div class="avatar" style="background:${progColor(h.programId)}">📝</div><div class="meta"><b>${dayName(h.tanggal)}, ${fmtDate(h.tanggal)} ${progChip(h.programId)}</b><div style="white-space:pre-line">${esc(h.deskripsi)}</div><span class="small muted">${esc(h.guruNama || '')}</span></div></div>`;
  const lapItem = l => `<div class="li"><div class="avatar" style="background:var(--periw)">📄</div><div class="meta"><b>${fmtPeriod(l.periode)} · ${esc(progById(l.programId).nama)}</b><span class="small muted">Hadir ${esc(l.hadir)}/${esc(l.pertemuan)}${l.rekomendasi ? ' · ' + esc(l.rekomendasi) : ''}</span></div><button class="btn sm" onclick="viewLaporan('${l.id}')">Lihat</button></div>`;
  let body = '';
  if (t === 'ringkas') {
    body = `${tg.total ? `<div class="card" style="background:var(--red-50);border-color:#F6C9C7"><div class="row"><div style="font-size:30px">⚠️</div><div style="flex:1;min-width:200px"><h3 style="color:var(--red-d);margin:0">Ada tagihan belum dibayar</h3><p class="small">${tg.bills.map(b => esc(progById(b.pid).nama) + ' ' + fmtPeriod(b.p)).concat(tg.jual.map(x => esc(x.j.nama))).join(', ')} · total <b>${rp(tg.total)}</b></p></div><button class="btn red" onclick="showTagihanOrtu()">Lihat Tagihan</button></div></div>`
      : `<div class="card" style="background:var(--ok-50);border-color:#BFE3CB"><div class="row"><div style="font-size:30px">✅</div><div><h3 style="color:var(--ok);margin:0">Pembayaran sudah lunas</h3><p class="small">Terima kasih Bapak/Ibu 🙏</p></div></div></div>`}
    <div class="grid g3">
      <div class="stat bg-teal"><span class="lbl">Hadir ${BULAN[+p.slice(5) - 1]}</span><span class="val num">${ab.filter(a => a.status === 'Hadir').length}/${ab.length}</span><span class="sub">pertemuan</span></div>
      <div class="stat bg-pri"><span class="lbl">Program</span><span class="val" style="font-size:17px">${spAktif(s.id).map(progLabel).map(esc).join('<br>') || '-'}</span></div>
      <div class="stat bg-periw click" onclick="S.tab.ortu='hasil';renderOrtu()"><span class="lbl">Laporan hasil belajar</span><span class="val num">${laps.length}</span><span class="sub">${laps[0] ? 'terbaru ' + fmtPeriod(laps[0].periode) : 'belum ada'} →</span></div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-head"><h3>Catatan perkembangan</h3><div class="spacer"></div>${notes.length > 3 ? `<button class="btn sm ghost" onclick="S.tab.ortu='catatan';renderOrtu()">Semua</button>` : ''}</div>${notes.slice(0, 3).map(noteItem).join('') || '<div class="empty">Belum ada catatan dari guru</div>'}</div>
      <div class="card"><h3>Jadwal les</h3>${D('Jadwal').map(j => `<div class="li"><div class="avatar" style="background:${progColor(j.programId)};font-size:11px">${esc(j.hari.slice(0, 3))}</div><div class="meta"><b>${esc(j.hari)}, ${esc(j.jamMulai)}–${esc(j.jamSelesai)}</b><span class="small muted">${esc(progById(j.programId).nama)} · ${esc(j.guruNama)} · ${esc(j.cabang)}</span></div></div>`).join('') || '<div class="empty">Belum ada jadwal</div>'}
        ${laps[0] ? `<h4 style="margin:12px 0 4px">Laporan terbaru</h4>${lapItem(laps[0])}` : ''}</div>
    </div>`;
  } else if (t === 'hasil') {
    body = `<div class="card"><h3>Laporan hasil belajar</h3>${laps.map(lapItem).join('') || '<div class="empty">Belum ada laporan</div>'}</div>`;
  } else if (t === 'catatan') {
    body = `<div class="card"><h3>Catatan perkembangan dari guru</h3>${notes.map(noteItem).join('') || '<div class="empty">Belum ada catatan</div>'}</div>`;
  } else if (t === 'absen') {
    const per = S.f.oP || p, rows = D('Absensi').filter(a => a.tanggal.startsWith(per)).sort((a, b) => b.tanggal.localeCompare(a.tanggal)), c = k => rows.filter(r => r.status === k).length;
    body = `<div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="S.f.oP=this.value;renderOrtu()">${monthOptions(per, 12, 0)}</select></div>
      <div class="row" style="margin-bottom:10px"><span class="badge b-green">Hadir ${c('Hadir')}</span><span class="badge b-blue">Izin ${c('Izin')}</span><span class="badge b-orange">Sakit ${c('Sakit')}</span><span class="badge b-red">Tanpa ket. ${c('Alpa')}</span></div>
      ${rows.map(r => `<div class="li"><div class="meta"><b>${dayName(r.tanggal)}, ${fmtDateLong(r.tanggal)}</b><span class="small muted">${esc(progById(r.programId).nama)}${r.catatan ? ' · ' + esc(r.catatan) : ''}</span></div><span class="badge ${absCls[r.status]}">${absLabel(r.status)}</span></div>`).join('') || '<div class="empty">Belum ada absensi di bulan ini</div>'}</div>`;
  } else {
    const bills = billsOfSiswa(s.id, p, 12).filter(b => b.st !== '-').reverse();
    const g = {}; D('Kas').filter(k => k.noKuitansi).forEach(k => (g[k.noKuitansi] = g[k.noKuitansi] || []).push(k));
    const kw = Object.entries(g).sort((a, b) => b[1][0].tanggal.localeCompare(a[1][0].tanggal));
    body = `<div class="card"><div class="card-head"><h3>Status SPP</h3><div class="spacer"></div><button class="btn sm ${tg.total ? 'red' : 'ghost'}" onclick="showTagihanOrtu()">${ic('file')} Tagihan</button></div>
      <div class="table-wrap"><table class="t"><thead><tr><th>Periode</th><th>Program</th><th class="r">Tagihan</th><th>Status</th></tr></thead><tbody>
      ${bills.map(b => `<tr class="${b.open ? 'unpaid' : ''}"><td><b>${fmtPeriod(b.p)}</b><div class="xs muted">jatuh tempo ${fmtDate(b.due)}</div></td><td>${progChip(b.pid)}</td><td class="r num">${rp(b.tag)}</td><td>${billBadge(b.st)}</td></tr>`).join('') || '<tr><td colspan="4"><div class="empty">Belum ada tagihan</div></td></tr>'}
      </tbody></table></div>
      <div class="note" style="margin-top:14px"><b>Cara bayar:</b> ${esc(st.rekening || '-')}, lalu konfirmasi ke admin.<div style="margin-top:8px"><button class="btn sm wa" onclick="ortuWaBayar()">${ic('wa')} Konfirmasi ke Admin</button></div></div></div>
    <div class="card"><h3>Riwayat pembayaran & kuitansi</h3>${kw.map(([no, ks]) => `<div class="li"><div class="avatar" style="background:var(--ok-50);color:var(--ok)">✓</div><div class="meta"><b>${fmtDate(ks[0].tanggal)} · ${rp(sum(ks, k => k.nominal))}</b><span class="small muted">${ks.map(k => esc(kasLineLabel(k))).join(', ')}</span></div><button class="btn sm ghost" onclick="showKuitansi('${no}')">Kuitansi</button></div>`).join('') || '<div class="empty">Belum ada pembayaran</div>'}</div>`;
  }
  $('#app').innerHTML = pTop('Portal Orang Tua') + `<div class="p-wrap">
    ${pHero(s.nama, `<p>${esc(s.id)} · ${esc(s.kelas || '')} · Cabang ${esc(s.cabang)}</p><p class="small">${stBadge(s.status)}</p>`)}
    <div class="row">${tabs('ortu', [['ringkas', 'Ringkasan'], ['hasil', 'Hasil Belajar'], ['catatan', 'Perkembangan'], ['absen', 'Kehadiran'], ['bayar', `Pembayaran${tg.total ? ' 🔴' : ''}`]], 'ringkas', 'renderOrtu()')}</div>
    ${body}
  </div>`;
}
function showTagihanOrtu() { const s = S.me.siswa; modal('Tagihan Pembayaran', tagihanHtml(s.id), `<button class="btn ghost" onclick="printHtml($('#modal .inv').outerHTML,'Tagihan')">${ic('print')} Cetak / PDF</button><button class="btn wa" onclick="ortuWaBayar()">${ic('wa')} Kirim Bukti Bayar</button>`, true); }
function ortuWaBayar() { const s = S.me.siswa; openWa(S.settings.noWa, `Assalamu'alaikum admin ${S.settings.namaLembaga}, saya orang tua ${s.nama} (${s.id}) ingin konfirmasi pembayaran. Berikut bukti transfernya:`); }

init();

</script>
